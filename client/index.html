<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Spielo</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Spielo UNO</h1>

    <div id="winnerBanner" class="winner-banner" hidden></div>

    <div id="menu">
        <button onclick="createRoom()">
            Raum erstellen
        </button>

        <input
            id="roomInput"
            placeholder="Raum Code"
        >

        <button onclick="joinRoom()">
            Beitreten
        </button>

        <button onclick="startGame()">
            Spiel starten
        </button>

        <button onclick="drawCard()">
            Karte ziehen
        </button>
        <button onclick="endTurn()">
            Zug beenden
        </button>
    </div>

    <div id="colorPicker" class="color-picker">
        <button onclick="selectColor('red')" class="color-btn red"></button>
        <button onclick="selectColor('blue')" class="color-btn blue"></button>
        <button onclick="selectColor('green')" class="color-btn green"></button>
        <button onclick="selectColor('yellow')" class="color-btn yellow"></button>
    </div>
    <hr>

    <h2 id="status">
        Nicht verbunden
    </h2>

    <h3>Oberste Karte</h3>
    <div id="topCard"></div>

    <h3>Spieler</h3>
    <div id="players"></div>

    <h3>Meine Hand</h3>
    <div id="hand"></div>

    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script src="app.js"></script>

</body>
</html>
